name: Jakarta EE 11 Web Profile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ee11-webprofile.yml'
      - '.mvn/**'
      - 'environment/**'
      - 'mvnw'
      - 'pom.xml'
      - 'runner-smoke/**'
      - 'tomee-porting/**'
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - '.github/workflows/ee11-webprofile.yml'
      - '.mvn/**'
      - 'environment/**'
      - 'mvnw'
      - 'pom.xml'
      - 'runner-smoke/**'
      - 'tomee-porting/**'

permissions:
  contents: read

concurrency:
  group: ee11-webprofile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify locked TCK metadata
        run: sh environment/verify-inputs.sh --metadata-only

      - name: Validate shell scripts
        run: |
          sh -n environment/verify-inputs.sh
          sh -n environment/tomee/bin/setenv.sh
          sh -n environment/certificates/generate-test-certificates.sh

      - name: Validate XML templates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          for source in sorted(Path('environment/tomee/conf').glob('*.xml')):
              ElementTree.parse(source)
              print(f'valid XML: {source}')
          PY

  smoke:
    needs: validate-environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']

    steps:
      - name: Check out sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run the TomEE Web Profile smoke runner
        run: ./mvnw -B -ntp -pl runner-smoke -am verify

      - name: Verify the resolved TomEE snapshot bytes
        if: always()
        run: sh environment/verify-inputs.sh --require-tomee

      - name: Collect reports and TomEE logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ee11-webprofile-java-${{ matrix.java }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            runner-smoke/target/surefire-reports/**
            runner-smoke/target/failsafe-reports/**
            runner-smoke/target/**/logs/**
            runner-smoke/target/*.log
