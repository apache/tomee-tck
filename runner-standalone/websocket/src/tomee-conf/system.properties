# Strict behavior is preferable for compatibility testing.
org.apache.catalina.STRICT_SERVLET_COMPLIANCE=true
user.language=en
user.country=US
user.timezone=UTC

# Required by the remote TomEE Arquillian container.
tomee.remote.support=true
openejb.system.apps=true

# Do not scan the runner or database implementation as deployments.
openejb.deployments.classpath=false
openejb.classloader.forced-skip=org.apache.derby.

# The abnormal-session-close timeout tests (session setTimeout2Test, spec
# closing status-1006-after-timeout) require the server-side Tomcat WebSocket
# container to poll for idle sessions on a short period and to bound the
# time spent sending the abnormal 1006 close. Match the values the TCK's
# certified Tomcat run uses so the client observes the close within ws_wait.
org.apache.tomcat.websocket.DEFAULT_PROCESS_PERIOD=0
org.apache.tomcat.websocket.ABNORMAL_SESSION_CLOSE_SEND_TIMEOUT=1000
