# Strict behavior is preferable for compatibility testing.
org.apache.catalina.STRICT_SERVLET_COMPLIANCE=true
user.language=en
user.country=US
user.timezone=UTC

# Required by the remote TomEE Arquillian container.
tomee.remote.support=true
openejb.system.apps=true

# Do not scan the runner or database implementation as deployments.
openejb.deployments.classpath=false
openejb.classloader.forced-skip=org.apache.derby.

# The Jakarta Validation TCK reads the provider under test on the server side.
validation.provider=org.apache.bval.jsr.ApacheValidationProvider
