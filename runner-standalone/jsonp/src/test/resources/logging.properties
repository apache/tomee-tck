# The JSON-P TCK logs the characters it round-trips at INFO, including ones
# XML cannot represent (U+FFFF among them). Surefire copies the captured
# streams into its report CDATA verbatim, so those records leave the XML
# unparseable and Jenkins' junit step reports a passing suite as a failure.
# Keep the console at WARNING so the reports stay well-formed; real problems
# still print, and the full INFO trail remains in the redirected .txt output.
handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
