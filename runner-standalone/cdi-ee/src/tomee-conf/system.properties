# Strict behavior is preferable for compatibility testing.
org.apache.catalina.STRICT_SERVLET_COMPLIANCE=true
user.language=en
user.country=US
user.timezone=UTC

# Required by the remote TomEE Arquillian container.
tomee.remote.support=true
openejb.system.apps=true

# Do not scan the runner or database implementation as deployments.
openejb.deployments.classpath=false
openejb.classloader.forced-skip=org.apache.derby.

# CDI TCK tuning mirrored from the apache/tomee tck/cdi-tomee runner.
openejb.scan.webapp.container=true
openejb.deploymentId.format={appId}/{ejbJarId}/{ejbName}
openejb.strict.interface.declaration=true
openejb.cdi.producer.interception=false
openejb.cdi.applicationScope.cached=false
openejb.cdi.requestScope.cached=false
openejb.cdi.conversation.http.use-get-parameter=true
cdiTckExcludeDummy=true
